name: CI
on:
  push:
  pull_request:

jobs:
  date-logic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -Wall -Wextra -Icomponents/egg_dates tests/test_egg_dates.cpp -o /tmp/t && /tmp/t

  esphome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install esphome
      - name: Validate and compile firmware
        run: |
          esphome config firmware/dev.yaml
          esphome compile firmware/dev.yaml
      - name: Validate the user-facing config (github:// references rewritten to local files)
        run: |
          printf 'wifi_ssid: ci\nwifi_password: ci-password\n' > firmware/secrets.yaml
          python - <<'PY'
          s = open("firmware/example-user-config.yaml").read()
          s = s.replace("github://CoolSaet/egg-freshness-tracker/firmware/egg-freshness-tracker.yaml@main",
                        "!include egg-freshness-tracker.yaml")
          s = s.replace("source: github://CoolSaet/egg-freshness-tracker@main",
                        "source:\n      type: local\n      path: ../components")
          s = s.replace("REPLACE-WITH-THE-KEY-THE-WIZARD-GENERATED",
                        "AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=")
          open("firmware/example.yaml", "w").write(s)
          PY
          esphome config firmware/example.yaml

  case:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y openscad
      - name: Render case and check STL files are up to date and valid
        run: |
          for p in body lid plunger; do
            openscad -D "part=\"$p\"" -o /tmp/$p.stl hardware/case/egg-case.scad 2>&1 | tee /tmp/$p.log
            grep -q "Simple: *yes" /tmp/$p.log
            cmp /tmp/$p.stl hardware/case/$p.stl || echo "::warning::$p.stl differs from fresh render (OpenSCAD version differences are possible)"
          done
